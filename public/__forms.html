<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Forms</title><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Netlify Forms detects this form at deploy time. The real form is
         src/slices/ContactForm/ProjectForm.tsx, which posts here as a backup copy. -->
    <form name="project-enquiry" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="company" />
    </form>
  </body>
</html>
